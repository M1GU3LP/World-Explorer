<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="World Explorer: explora los países del mundo en un globo 3D con datos, capitales e idiomas.">

    <title>World Explorer</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">

    <!-- Bootstrap con versión fija -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <a class="skip-link" href="#panel-lateral">Saltar al buscador de países</a>

    <header class="encabezado border-bottom">
        <div class="container-fluid d-flex flex-wrap align-items-center justify-content-between gap-2 py-2">
            <div>
                <h1 class="h4 mb-0">🌍 WORLD EXPLORER</h1>
                <p class="mb-0 small text-body-secondary d-none d-sm-block">
                    Explora los países del mundo: datos, capitales e idiomas
                </p>
            </div>

            <div class="d-flex flex-wrap gap-2">
                <button type="button" id="btn-tema" class="btn btn-secondary btn-sm">☀ Usar tema claro</button>
                <button type="button" id="btn-borrar-datos" class="btn btn-danger btn-sm">Borrar mis datos guardados</button>
            </div>
        </div>
    </header>

    <div class="container-fluid pt-2">
        <div id="error-banner" class="alert alert-danger mb-2" role="alert" hidden></div>
        <div id="mensaje-estado" class="alert alert-success mb-2" role="status" hidden></div>
        <div id="indicador-carga" class="alert alert-info mb-2" role="status" hidden>
            <div class="d-flex align-items-center gap-2">
                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                <span id="texto-carga">Cargando…</span>
        </div>
</div>
    </div>

    <main class="container-fluid flex-grow-1 pb-3">
        <div class="row g-3">

            <section id="globe-container-col" class="col-12 col-lg-6 order-1 order-lg-2" aria-label="Globo terráqueo interactivo">
                <div id="globe-container" class="rounded-3 overflow-hidden">
                    <div id="globeViz"></div>
                </div>
            </section>

            <section id="panel-lateral" class="col-12 col-md-6 col-lg-3 order-2 order-lg-1" aria-label="Buscador y favoritos">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column gap-3">

                        <div>
                            <label for="buscar-pais" class="form-label">Buscar país</label>
                            <input type="search" id="buscar-pais" class="form-control mb-2"
                                   placeholder="Ej: Colombia, Japón..." autocomplete="off">

                            <label for="filtro-region" class="form-label">Filtrar por región</label>
                            <select id="filtro-region" class="form-select">
                                <option value="">Todas las regiones</option>
                            </select>
                        </div>

                        <ul id="lista-resultados" class="list-group lista-scroll" aria-label="Resultados de la búsqueda"></ul>

                        <div class="border-top pt-3">
                            <button type="button" id="toggle-favoritos"
                                    class="btn btn-favoritos btn-sm mb-2"
                                    data-bs-toggle="collapse" data-bs-target="#coleccion-favoritos"
                                    aria-expanded="true" aria-controls="coleccion-favoritos">
                                ★ Favoritos <span id="contador-favoritos" class="badge text-bg-secondary">0</span>
                            </button>

                            <div id="coleccion-favoritos" class="collapse show">
                                <ul id="lista-favoritos" class="list-group lista-scroll" aria-label="Países favoritos"></ul>
                            </div>
                        </div>

                    </div>
                </div>
            </section>

            <aside id="info-panel" class="col-12 col-md-6 col-lg-3 order-3" aria-live="polite" aria-label="Información del país">
                <div class="card h-100">
                    <div class="card-body">

                        <div id="flag" class="mb-2"></div>

                        <h2 id="country-name" class="h4 mb-3">Selecciona un país</h2>

                        <button type="button" id="btn-favorito" class="btn btn-favoritos btn-sm mb-3"
                                aria-pressed="false" hidden></button>

                        <p class="mb-2"><strong>Nombre oficial:</strong> <span id="official-name"></span></p>
                        <p class="mb-2"><strong>Capital:</strong> <span id="capital"></span></p>
                        <p class="mb-2"><strong>Población:</strong> <span id="population"></span></p>
                        <p class="mb-2"><strong>Región:</strong> <span id="region"></span></p>
                        <p class="mb-2"><strong>Idiomas:</strong> <span id="languages"></span></p>
                        <p class="mb-0"><strong>Moneda:</strong> <span id="currency"></span></p>

                    </div>
                </div>
            </aside>

        </div>
    </main>

    <!-- Bibliotecas externas -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>

    <!-- JavaScript de la aplicación (módulos ES; los módulos se cargan diferidos por defecto) -->
    <script type="module" src="js/main.mjs"></script>

</body>

</html>
